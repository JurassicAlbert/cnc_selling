# Local development database.
#
#   docker compose up -d db          start
#   docker compose logs -f db        watch
#   docker compose down              stop, keep data
#   docker compose down -v           stop, DESTROY data
#
# Two databases are created: `cnc_selling` for development and
# `cnc_selling_test` for integration tests, so a test run that truncates
# tables can never wipe the data you were looking at in the app.
#
# Nothing here is production configuration. The password is deliberately
# trivial and the port is published to localhost only.
#
# Published as 5433, not 5432: a native Postgres install already listens on
# 5432 on this machine, and `docker compose up` fails to bind if we ask for
# the same port. DATABASE_URL / TEST_DATABASE_URL in .env.example use 5433.

services:
  db:
    image: postgres:16-alpine
    container_name: cnc_selling_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cnc
      POSTGRES_PASSWORD: cnc_dev_password
      POSTGRES_DB: cnc_selling
      # Polish collation is set per-database at creation time by the init
      # script; this only affects the template used for `initdb`.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      # localhost only: never expose Postgres on the LAN from a dev machine.
      - '127.0.0.1:5433:5432'
    volumes:
      - cnc_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # `pg_isready` returns success while the server is still finishing the
      # init scripts, so the check also runs a real query.
      test: ['CMD-SHELL', 'pg_isready -U cnc -d cnc_selling && psql -U cnc -d cnc_selling -c "select 1" > /dev/null']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  cnc_pgdata:
