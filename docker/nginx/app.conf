# Reverse proxy in front of the Next server.
#
# Next's own self-hosting guide recommends one rather than exposing the Node
# server directly: it absorbs malformed requests, slow-connection attacks and
# payload limits, so the app spends its time rendering instead of validating.

upstream app {
    server app:3000;
    keepalive 32;
}

# Everything on http is redirected. Session cookies are Secure, so http is not
# a degraded experience here - it is a login that silently never works.
server {
    listen 80;
    server_name _;

    # The one exception: ACME's challenge path, so certbot can renew without
    # the redirect bouncing it.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # The configurator accepts uploads and `next.config.ts` sets a 26mb Server
    # Action body limit. nginx defaults to 1m, so without this the app's own
    # limit would never be reached: a large upload would be refused by the
    # proxy with a bare 413 and none of the application's error handling.
    client_max_body_size 26m;

    # ---- Streaming ----------------------------------------------------------
    # This block is the whole reason the proxy config is not boilerplate.
    #
    # nginx buffers upstream responses by default, which holds a streamed
    # render until it is complete. A `<Suspense>` boundary would still work,
    # the page would just arrive all at once and later - no error, no warning,
    # simply none of the benefit. Next's self-hosting guide names this
    # explicitly under "Streaming and Suspense".
    #
    # The app also sends `X-Accel-Buffering: no` from `next.config.ts`, which
    # nginx honours per-response; these directives are the belt to that brace,
    # so the guarantee does not depend on a single header surviving.
    proxy_buffering off;
    proxy_request_buffering off;
    # HTTP/1.1 is required for chunked transfer encoding, and nginx defaults
    # to 1.0 when talking upstream. Without this, streaming cannot work at all.
    proxy_http_version 1.1;

    location /_next/static/ {
        proxy_pass http://app;
        # Content-hashed filenames, so this is safe and removes a round trip
        # per asset on every repeat visit.
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Without this the app believes every request arrived over http and
        # builds http:// URLs into emails and redirects.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # A render that streams is still one response. The default 60s read
        # timeout would cut a slow catalogue page off mid-stream.
        proxy_read_timeout 120s;
    }
}
