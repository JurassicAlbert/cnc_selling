      <path d="M15,190 L18,60" />
      <path d="M35,190 L37,50" />
      <path d="M165,190 L163,55" />
      <path d="M182,190 L180,65" />
    </g>

    <!-- mid trunks -->
    <g stroke-width="4" stroke-opacity="0.55">
      <path d="M55,192 L58,40" />
      <path d="M148,192 L146,45" />
    </g>
    <g stroke-width="1.5" stroke-opacity="0.55">
      <path d="M56,70 L60,68" />
      <path d="M55,100 L61,99" />
      <path d="M56,130 L60,132" />
      <path d="M147,80 L151,78" />
      <path d="M146,115 L150,117" />
      <path d="M147,150 L151,149" />
