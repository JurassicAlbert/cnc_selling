      <path d="M120,195 L117,20" />
    </g>
    <g stroke-width="2.5" stroke-linecap="round">
      <path d="M85,45 L91,43" />
      <path d="M86,75 L92,78" />
      <path d="M87,105 L93,103" />
      <path d="M87,140 L93,143" />
      <path d="M88,170 L94,168" />
      <path d="M114,55 L120,53" />
      <path d="M115,85 L121,87" />
      <path d="M116,120 L122,118" />
      <path d="M117,155 L123,157" />
    </g>

    <!-- canopy -->
    <path d="M60,30 Q102,4 145,32 Q160,45 148,58 Q108,20 62,55 Q48,42 60,30 Z"
          stroke-width="2" fill="#3E2A1A" fill-opacity="0.1" />

    <!-- fallen leaves / ground texture -->
    <g stroke-width="1.5" stroke-opacity="0.4">
      <path d="M30,188 Q34,183 39,188" />
      <path d="M70,192 Q75,186 80,192" />
      <path d="M100,190 Q105,185 110,190" />
      <path d="M135,193 Q140,187 145,193" />
      <path d="M165,189 Q169,184 173,189" />
